name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      PI_EXA_CI_PLATFORM: ${{ matrix.platform }}
      PI_EXA_CI_ARCH: ${{ matrix.arch }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: |
            - args: ["--frozen-lockfile"]
          cache: true

      - name: Show effective runtime
        run: vp env current --json

      - name: Check package
        run: vp run check

      - name: Test package
        run: vp run test
